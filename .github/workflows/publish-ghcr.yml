name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test, and publish image
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-java v5.0.0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate release tag, branch, note, and project version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ref '${TAG_NAME}' is not a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          RELEASE_SHA="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "::error::${TAG_NAME} (${RELEASE_SHA}) is not contained in origin/main."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          RELEASE_NOTE="docs/releases/v${VERSION}.md"
          if ! git cat-file -e "${RELEASE_SHA}:${RELEASE_NOTE}"; then
            echo "::error::${RELEASE_NOTE} is missing from the tagged commit."
            exit 1
          fi
          if ! git show "${RELEASE_SHA}:${RELEASE_NOTE}" | grep -q '[^[:space:]]'; then
            echo "::error::${RELEASE_NOTE} is empty in the tagged commit."
            exit 1
          fi

          PROJECT_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tag ${TAG_NAME} does not match Maven project.version ${PROJECT_VERSION}."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the release image once
        shell: bash
        env:
          IMAGE: ghcr.io/g2rain/g2rain-gateway-webflux
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg JAR_FILE="target/g2rain-gateway-webflux-${VERSION}.jar" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg VCS_REF="${RELEASE_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${RELEASE_SHA}" \
            .

      - name: Push both immutable release tags
        shell: bash
        env:
          IMAGE: ghcr.io/g2rain/g2rain-gateway-webflux
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${RELEASE_SHA}"
          {
            echo '## GHCR publication succeeded'
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Immutable commit tag: \`${IMAGE}:sha-${RELEASE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
